<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your CapCar email</title>
  </head>
  <body style="margin:0;background-color:#151d28;color:#f0f1f3;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#151d28">
      <tr>
        <td align="center" style="padding:24px 12px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:540px;background-color:#243244;border-radius:16px">
            <tr>
              <td style="padding:28px 24px;color:#f0f1f3">
                <img src="https://capcar.dev/capcar-mark-192.png" alt="" width="48" height="48" style="display:block;border:0">
                <p style="margin:12px 0 24px;font-size:18px;font-weight:bold;letter-spacing:1px">CapCar</p>
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2">Confirm your CapCar email</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6">One more step to open your garage. Confirm your email address to finish setting up your CapCar account.</p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td bgcolor="#a7ceff" style="border-radius:8px">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;color:#151d28;font-size:16px;line-height:20px;font-weight:bold;text-decoration:none">Confirm email</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:20px 0 0;color:#becbda;font-size:14px;line-height:1.6">Open the link in the same browser you used to register.</p>
                <p style="margin:16px 0 0;color:#becbda;font-size:14px;line-height:1.6">If you didn’t sign up for CapCar, you can ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#becbda;font-size:13px">CapCar · <a href="https://capcar.dev" style="color:#a7ceff">capcar.dev</a></p>
        </td>
      </tr>
    </table>
  </body>
</html>
